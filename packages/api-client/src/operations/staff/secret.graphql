# The secret detail page (U-04). Field values come only from secretFields (non-sensitive) and
# the reveal mutations; nothing here asks for a sensitive value.

fragment SecretDetailFields on Secret {
  id
  name
  canRead
  folderId
  typeId
  targetId
  expiresAt
  lastHeartbeatResult
  verifiedAt
  viewCount
  lastAccessedAt
  retired
  retiredAt
  lastRotationResult
  rotatedAt
  rotationIntervalDays
  nextRotationAt
  rotationOptOut
  heartbeatOptOut
  requireTokenApproval
}

fragment SecretCertMetaFields on CertMeta {
  subject
  issuer
  sans
  notBefore
  notAfter
  serialNumber
  fingerprintSha256
  keyAlgorithm
  keyBits
  isCA
  hasPrivateKey
}

query SecretDetail($id: ID!) {
  secret(id: $id) {
    ...SecretDetailFields
  }
  secretTypes {
    id
    name
    origin
    vendor
    checkout
    heartbeat
    rotation
    fields {
      key
      label
      kind
      options
      sensitive
      superSensitive
      rotates
    }
  }
  folders {
    id
    name
    parentId
    scope
  }
  targets {
    id
    name
    hostname
  }
}

query SecretAccess($secretId: String!) {
  mySecretAccess(secretId: $secretId) {
    read
    reveal
    manage
    approve
    informed
  }
}

query SecretFields($id: ID!) {
  secretFields(id: $id) {
    key
    value
  }
}

query SecretVersions($secretId: ID!) {
  secretVersions(secretId: $secretId) {
    versionNo
    createdBy
    createdByName
    createdAt
    active
    fieldKeys
    changedFieldKeys
  }
}

mutation SecretReveal($id: ID!, $fieldKey: String!) {
  revealSecretField(id: $id, fieldKey: $fieldKey)
}

mutation SecretRevealVersion($secretId: ID!, $versionNo: Int!, $fieldKey: String!) {
  revealSecretVersionField(secretId: $secretId, versionNo: $versionNo, fieldKey: $fieldKey)
}

mutation SecretBreakGlass($secretId: String!, $reason: String!, $code: String!) {
  breakGlassSecret(secretId: $secretId, reason: $reason, code: $code) {
    key
    value
  }
}

mutation SecretRotate($secretId: String!) {
  rotateSecret(secretId: $secretId)
}

mutation SecretSetAutomation(
  $secretId: String!
  $disableRotation: Boolean!
  $disableHeartbeat: Boolean!
) {
  setSecretAutomation(
    secretId: $secretId
    disableRotation: $disableRotation
    disableHeartbeat: $disableHeartbeat
  ) {
    ...SecretDetailFields
  }
}

mutation SecretSetTokenApproval($secretId: String!, $required: Boolean!) {
  setSecretTokenApproval(secretId: $secretId, required: $required) {
    ...SecretDetailFields
  }
}

mutation SecretRetire($id: String!) {
  retireSecret(id: $id) {
    ...SecretDetailFields
  }
}

mutation SecretRestore($id: String!) {
  restoreSecret(id: $id) {
    ...SecretDetailFields
  }
}

mutation SecretDelete($id: String!) {
  deleteSecret(id: $id)
}

mutation SecretExportCertificate($secretId: String!, $format: String!, $newPassphrase: String) {
  exportCertificate(secretId: $secretId, format: $format, newPassphrase: $newPassphrase) {
    fileBase64
    filename
    contentType
  }
}

mutation SecretReplaceCertificate(
  $secretId: String!
  $fileBase64: String!
  $passphrase: String
  $alias: String
) {
  replaceCertificate(
    secretId: $secretId
    fileBase64: $fileBase64
    passphrase: $passphrase
    alias: $alias
  ) {
    secret {
      ...SecretDetailFields
    }
    aliases
    meta {
      ...SecretCertMetaFields
    }
  }
}
